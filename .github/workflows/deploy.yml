name: Schoolopedia CI & Edge Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Install Dependencies
        run: pnpm install

      - name: Run Automated Test Suite
        run: pnpm test

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Build Packages & Web Application
        run: pnpm build

      - name: Check Cloudflare Deployment Credentials
        id: cf_check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Cloudflare deployment token detected. Edge deployment will proceed."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare deployment token not configured in repository secrets."
            echo "Automated CI tests and builds passed with 100% success. Edge deployment skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Edge API Worker to Cloudflare
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.cf_check.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy Frontend Web Application to Cloudflare
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.cf_check.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
