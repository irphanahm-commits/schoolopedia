name: Schoolopedia CI & Edge Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Install Dependencies
        run: pnpm install

      - name: Run Automated Test Suite
        run: pnpm test

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Build Packages & Web Application
        run: pnpm build

      - name: Deploy Edge API Worker to Cloudflare
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy Frontend Web Application to Cloudflare
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy

      - name: Deployment Secret Notice
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice title=Cloudflare Edge Deployment Skipped::Automated tests, typecheck, and production builds all passed successfully. Direct CI deployment from GitHub is paused because CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. To enable automatic deployments from GitHub Actions, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions."

