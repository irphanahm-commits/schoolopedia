name = "schoolopedia-api"
main = "workers/api/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "schoolopedia-db"
database_id = "schoolopedia-db"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "schoolopedia-cache"

[[r2_buckets]]
binding = "R2"
bucket_name = "schoolopedia-snapshots"

[triggers]
crons = ["*/15 * * * *"]
